# Builds the production images from this checkout and runs the suite against
# them. Uses throwaway configuration from ./env; nothing is pulled from a
# registry, so it tests the code in front of you rather than the last push.

x-service: &service
  env_file:
    - ./env/shared.env

x-health: &health
  interval: 3s
  timeout: 3s
  retries: 40

# The services' own /health/ready, probed from inside the container.
x-ready: &ready
  test: ['CMD-SHELL', "node -e \"fetch('http://localhost:' + process.env.HTTP_PORT + '/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))\""]
  <<: *health

services:
  e2e:
    build:
      context: .
      dockerfile: ./Dockerfile
    # Database credentials and the webhook secret, for the specs that set up
    # state directly or play Stripe.
    env_file:
      - ./env/shared.env
    depends_on:
      reservations:
        condition: service_healthy
      auth:
        condition: service_healthy
      payments:
        condition: service_healthy
      notifications:
        condition: service_healthy
    volumes:
      - ./specs:/usr/src/app/specs

  mysql:
    image: mysql:8.0
    env_file:
      - ./env/shared.env
    # No volume: every run starts from an empty database, which also proves
    # the migrations build the schema from scratch.
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" --silent']
      <<: *health

  rabbitmq:
    image: rabbitmq:4.1-alpine
    volumes:
      - ../docker/rabbitmq/guest-from-network.conf:/etc/rabbitmq/conf.d/90-guest.conf:ro
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      <<: *health

  # Accepts SMTP and keeps every message, with an HTTP API the specs read to
  # check that emails were sent.
  mailpit:
    image: axllent/mailpit:v1.31
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      <<: *health

  auth:
    <<: *service
    build:
      context: ..
      dockerfile: ./apps/auth/Dockerfile
    environment:
      HTTP_PORT: 3001
      TCP_PORT: 3002
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck: *ready

  reservations:
    <<: *service
    build:
      context: ..
      dockerfile: ./apps/reservations/Dockerfile
    environment:
      HTTP_PORT: 3000
      TCP_PORT: 3005
      SWAGGER_ENABLED: 'true'
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck: *ready

  payments:
    <<: *service
    build:
      context: ..
      dockerfile: ./apps/payments/Dockerfile
    environment:
      HTTP_PORT: 3006
      TCP_PORT: 3003
    healthcheck: *ready

  notifications:
    <<: *service
    build:
      context: ..
      dockerfile: ./apps/notifications/Dockerfile
    environment:
      HTTP_PORT: 3004
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck: *ready

apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: nestjs-suit-2
  region: us-east-1

nodeGroups:
  - name: ng-1
    # t2.micro allows only 4 pods per node (ENI limit) and 1 GiB of memory,
    # most of which kube-system takes before any service is scheduled.
    instanceType: t3.medium
    desiredCapacity: 2

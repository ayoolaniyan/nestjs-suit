version: 0.2

# Builds the four production images and pushes them to ECR, tagged with the
# commit SHA (immutable, what Helm should deploy) and `latest`.
#
# The account is read from the build's own credentials and the region from
# CodeBuild's AWS_DEFAULT_REGION, so nothing account-specific is committed.

env:
  variables:
    SERVICES: 'reservations auth payments notifications'

phases:
  pre_build:
    commands:
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REGISTRY=$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-7)
      - aws ecr get-login-password | docker login --username AWS --password-stdin $REGISTRY
  build:
    commands:
      - |
        for service in $SERVICES; do
          docker build -t $REGISTRY/$service:$TAG -t $REGISTRY/$service:latest -f ./apps/$service/Dockerfile .
        done
  post_build:
    commands:
      # post_build runs even when build failed; never push a partial set.
      - '[ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ] || { echo "Build failed, not pushing"; exit 1; }'
      - |
        for service in $SERVICES; do
          docker push --all-tags $REGISTRY/$service
        done
      - echo "Deploy with --set global.imageTag=$TAG"

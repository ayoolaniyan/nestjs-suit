global:
  # ECR registry, e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com. Required.
  imageRegistry: ''
  # Deploy the commit SHA tag that buildspec.yaml prints, not `latest`, so a
  # release is reproducible and can be rolled back.
  imageTag: latest

# Ports match the apps' .env.example files and docker-compose.
ports:
  reservationsHttp: 3000
  # Payment outcomes from payments.
  reservationsTcp: 3005
  authHttp: 3001
  authTcp: 3002
  paymentsTcp: 3003
  # Stripe webhooks, health and metrics.
  paymentsHttp: 3006
  # Health checks only; notifications consumes from RabbitMQ.
  notificationsHttp: 3004

mysql:
  # e.g. the RDS endpoint. Required.
  host: ''
  port: 3306
  database: reservations
  # Secret with `username` and `password` keys, for a non-root database user.
  secretName: mysql

jwt:
  # Secret with a `jwtSecret` key.
  secretName: jwt
  # Access token lifetime. Short, since the refresh token renews it.
  expirationSeconds: 900
  # Session (refresh token) lifetime.
  refreshExpirationSeconds: 2592000

stripe:
  # Secret with `apiKey` and `webhookSecret` (whsec_...) keys. Point the
  # Stripe webhook endpoint at https://<host>/payments/webhook, sending
  # payment_intent.succeeded and payment_intent.payment_failed.
  secretName: stripe

rabbitmq:
  # Secret with a `url` key, e.g. amqps://user:password@b-xxxx.mq.us-east-1.amazonaws.com:5671
  # for Amazon MQ. Carries notification emails from reservations.
  secretName: rabbitmq

# The public HTTP services (auth, reservations).
security:
  # Comma-separated browser origins allowed to call the API with cookies.
  # Empty: cross-origin requests are refused.
  corsOrigins: ''
  # The ALB, whose X-Forwarded-For gives the client address that rate limits
  # are counted against.
  trustProxyHops: 1
  rateLimitPerMinute: 120
  loginAttemptsPer15Min: 10

notifications:
  # The sender address. Required.
  mailFrom: ''
  # smtp (e.g. Amazon SES's SMTP interface) or gmail (OAuth2).
  transport: smtp
  smtp:
    host: ''
    port: 587
    # true for implicit TLS on 465; otherwise STARTTLS.
    secure: false
    # Leave empty for an unauthenticated relay.
    user: ''
    # Secret with a `password` key; used when user is set.
    passwordSecretName: smtp
  gmail:
    user: ''
    clientId: ''
    # Secret with `clientSecret` and `refreshToken` keys.
    secretName: google
  # Attempts per email before it is parked in notifications.dead.
  maxAttempts: 5

# Serves OpenAPI docs at /auth/docs and /reservations/docs. Off by default:
# publishing the API surface of a production deployment is an opt-in.
swaggerEnabled: false

# auth and reservations apply their database migrations at startup. Keep them
# at one replica unless migrations move to a separate job, or two pods may
# race to apply the same one.
replicas:
  reservations: 1
  auth: 1
  payments: 1
  notifications: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/healthcheck-path: /health

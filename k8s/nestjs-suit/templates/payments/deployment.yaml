apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: payments
  name: payments
spec:
  replicas: {{ .Values.replicas.payments }}
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - image: {{ include "nestjs-suit.image" (dict "root" . "name" "payments") }}
          name: payments
          env:
            - name: PORT
              value: {{ .Values.ports.payments | quote }}
            - name: NOTIFICATION_HOST
              value: notifications
            - name: NOTIFICATION_PORT
              value: {{ .Values.ports.notifications | quote }}
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.stripe.secretName }}
                  key: apiKey
          ports:
            - name: tcp
              containerPort: {{ .Values.ports.payments }}
          {{- include "nestjs-suit.tcpProbes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- include "nestjs-suit.securityContext" . | nindent 10 }}

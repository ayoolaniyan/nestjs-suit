apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: auth
  name: auth
spec:
  replicas: {{ .Values.replicas.auth }}
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
      annotations:
        {{- include "nestjs-suit.metricsAnnotations" (dict "port" .Values.ports.authHttp) | nindent 8 }}
    spec:
      containers:
        - image: {{ include "nestjs-suit.image" (dict "root" . "name" "auth") }}
          name: auth
          env:
            {{- include "nestjs-suit.mysqlEnv" . | nindent 12 }}
            {{- include "nestjs-suit.securityEnv" . | nindent 12 }}
            - name: LOGIN_ATTEMPTS_PER_15_MIN
              value: {{ .Values.security.loginAttemptsPer15Min | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jwt.secretName }}
                  key: jwtSecret
            - name: JWT_EXPIRATION
              value: {{ .Values.jwt.expirationSeconds | quote }}
            - name: REFRESH_TOKEN_EXPIRATION
              value: {{ .Values.jwt.refreshExpirationSeconds | quote }}
            - name: SWAGGER_ENABLED
              value: {{ .Values.swaggerEnabled | quote }}
            - name: HTTP_PORT
              value: {{ .Values.ports.authHttp | quote }}
            - name: TCP_PORT
              value: {{ .Values.ports.authTcp | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.ports.authHttp }}
            - name: tcp
              containerPort: {{ .Values.ports.authTcp }}
          {{- include "nestjs-suit.httpProbes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- include "nestjs-suit.securityContext" . | nindent 10 }}

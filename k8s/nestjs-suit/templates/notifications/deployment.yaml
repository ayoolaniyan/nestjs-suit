apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: notifications
  name: notifications
spec:
  replicas: {{ .Values.replicas.notifications }}
  selector:
    matchLabels:
      app: notifications
  template:
    metadata:
      labels:
        app: notifications
    spec:
      containers:
        - image: {{ include "nestjs-suit.image" (dict "root" . "name" "notifications") }}
          name: notifications
          env:
            - name: PORT
              value: {{ .Values.ports.notifications | quote }}
            - name: SMTP_USER
              value: {{ required "notifications.smtpUser is required" .Values.notifications.smtpUser | quote }}
            - name: GOOGLE_OAUTH_CLIENT_ID
              value: {{ required "notifications.googleOAuthClientId is required" .Values.notifications.googleOAuthClientId | quote }}
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.notifications.googleSecretName }}
                  key: clientSecret
            - name: GOOGLE_OAUTH_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.notifications.googleSecretName }}
                  key: refreshToken
          ports:
            - name: tcp
              containerPort: {{ .Values.ports.notifications }}
          {{- include "nestjs-suit.tcpProbes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- include "nestjs-suit.securityContext" . | nindent 10 }}

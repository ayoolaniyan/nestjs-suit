apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: reservations
  name: reservations
spec:
  replicas: {{ .Values.replicas.reservations }}
  selector:
    matchLabels:
      app: reservations
  template:
    metadata:
      labels:
        app: reservations
    spec:
      containers:
        - image: {{ include "nestjs-suit.image" (dict "root" . "name" "reservations") }}
          name: reservations
          env:
            {{- include "nestjs-suit.mysqlEnv" . | nindent 12 }}
            - name: PORT
              value: {{ .Values.ports.reservations | quote }}
            - name: AUTH_HOST
              value: auth-tcp
            - name: AUTH_PORT
              value: {{ .Values.ports.authTcp | quote }}
            - name: PAYMENTS_HOST
              value: payments
            - name: PAYMENTS_PORT
              value: {{ .Values.ports.payments | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.ports.reservations }}
          {{- include "nestjs-suit.httpProbes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- include "nestjs-suit.securityContext" . | nindent 10 }}

{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nestjs-suit
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /reservations
            pathType: Prefix
            backend:
              service:
                name: reservations
                port:
                  number: {{ .Values.ports.reservationsHttp }}
          - path: /places
            pathType: Prefix
            backend:
              service:
                name: reservations
                port:
                  number: {{ .Values.ports.reservationsHttp }}
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth-http
                port:
                  number: {{ .Values.ports.authHttp }}
          # Stripe's webhook deliveries. The signature check, not the network,
          # is what keeps others out, so the path has to be public.
          - path: /payments/webhook
            pathType: Exact
            backend:
              service:
                name: payments-http
                port:
                  number: {{ .Values.ports.paymentsHttp }}
          # Signup and "current user" live on the auth service's /users
          # controller, which the ingress previously did not route at all.
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: auth-http
                port:
                  number: {{ .Values.ports.authHttp }}
{{- end }}
